services:
  db:
    image: postgres:16.1-alpine
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${db_user}
      POSTGRES_PASSWORD: ${db_password}
      POSTGRES_DB: ${db_name}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
  app:
    build: .
    image: weather_app_image
    container_name: weather_app
    env_file:
      - .env.prod
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - db.url=${db_url}
      - db.port=${db_port}
      - db.name=${db_name}
      - db.user=${db_user}
      - db.password=${db_password}
      - api.key=${api_key}
      - session_storage_time=${session_storage_time}
      - url.geo=${url_geo}
      - url.city=${url_city}
volumes:
  pg_data: